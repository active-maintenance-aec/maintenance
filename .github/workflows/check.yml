# Reruns an active maintenance repository's run_all.R on current R and current CRAN
# packages, and fails if the pipeline breaks or the run changes any committed file.
#
# Each paper repository calls this from a short .github/workflows/maintenance.yml that
# fires once a week in its own slot (see schedule.csv). The gate job runs every week: it
# re-enables the caller's workflow, which stops GitHub from disabling the schedule after
# 60 days without repository activity, and lets the full check through only in the
# repository's own week of the cycle. A manual dispatch always runs the full check.

name: check

on:
  workflow_call:
    inputs:
      phase:
        description: The repository's week in the cycle, from 0 to cycle - 1.
        type: number
        required: true
      cycle:
        description: Weeks between full checks.
        type: number
        default: 8
      archive_skip_slow:
        description: >
          Skip the deposited scripts the deposit documents as slow when the pipeline reruns
          the archive as a program (ARCHIVE_RUN_SKIP_SLOW=1). For a repository whose full run
          exceeds GitHub's six-hour job limit, or whose deposited scripts need more memory
          than the runner's 16 GB. The maintained pipeline and its ground truth are
          still judged; the archive rerun's records are left to the local sweep.
        type: boolean
        default: false
      unjudged:
        description: >
          Space-separated git pathspecs of outputs this repository's run cannot reproduce on
          the runner, restored rather than judged. For outputs that move because of something
          the runner cannot hold fixed (coppock_2017a's bootstrap converges on a different set
          of draws under Linux's LAPACK). The local sweep still judges them.
        type: string
        default: ""
      verdicts_only:
        description: >
          Space-separated ground-truth CSVs judged on their verdicts alone: restored when only
          value_script and value_rewrite moved (compare_csv.py --verdicts), judged otherwise.
        type: string
        default: ""
      monte_carlo:
        description: >
          Space-separated git pathspecs, each optionally suffixed =RTOL:ATOL for a file on
          its own scale, of CSVs that hold Monte Carlo quantities (MCMC or
          bootstrap draws that cannot agree across platforms). Restored when every number
          moved by no more than monte_carlo_atol + monte_carlo_rtol x |value| plus one unit
          in its last printed place; ground-truth verdicts may flip only on rows inside that
          band, and float_coverage.csv is restored when its change follows from those flips
          (compare_csv.py --monte-carlo). Judged otherwise.
        type: string
        default: ""
      monte_carlo_rtol:
        description: Relative Monte Carlo tolerance, sized per repository from measured moves.
        type: string
        default: "0"
      monte_carlo_atol:
        description: Absolute Monte Carlo tolerance, sized per repository from measured moves.
        type: string
        default: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/maintenance.yml/enable"

      - name: Decide whether this is the repository's week
        id: week
        run: |
          week=$(( $(date -u +%s) / 604800 % ${{ inputs.cycle }} ))
          echo "Cycle week $week; this repository checks in week ${{ inputs.phase }}."
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$week" -eq "${{ inputs.phase }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/checkout@v4
        with:
          repository: active-maintenance-aec/maintenance
          path: maintenance

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Does the pipeline render with Quarto?
        id: quarto
        working-directory: repo
        run: |
          if grep -q quarto run_all.R; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.quarto.outputs.needed == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install the packages the pipeline loads
        working-directory: repo
        run: |
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
          Rscript -e 'pak::pkg_install(c("readr", "stringr", "purrr"), ask = FALSE)'
          Rscript ../maintenance/deps.R

      # run_all.R reruns the deposited scripts as a program, and they load packages the
      # maintained code does not. Fetching the deposit here (run_all.R fetches it again and
      # finds it verified) lets those be installed too. A fetch that fails is left for
      # run_all.R to report, since a deposit that will not verify is the urgent case.
      - name: Install the packages the deposited scripts load
        working-directory: repo
        run: |
          if [ -f download_original.R ]; then
            if Rscript download_original.R > ../download.log 2>&1; then
              Rscript ../maintenance/deps.R --deposit
            else
              tail -n 20 ../download.log
            fi
          fi

      - name: Record R and package versions
        working-directory: repo
        run: |
          Rscript -e 'print(R.version.string)'
          Rscript -e 'ip <- installed.packages(); readr::write_csv(tibble::as_tibble(ip[, c("Package", "Version")]), "../packages.csv")'

      - name: Run run_all.R
        id: run
        working-directory: repo
        env:
          ARCHIVE_RUN_SKIP_SLOW: ${{ inputs.archive_skip_slow && '1' || '0' }}
        run: |
          set +e
          Rscript run_all.R > ../run_all.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 40 ../run_all.log

      - name: Report
        working-directory: repo
        env:
          UNJUDGED: ${{ inputs.unjudged }}
          VERDICTS_ONLY: ${{ inputs.verdicts_only }}
          MONTE_CARLO: ${{ inputs.monte_carlo }}
          MC_RTOL: ${{ inputs.monte_carlo_rtol }}
          MC_ATOL: ${{ inputs.monte_carlo_atol }}
        run: |
          status="${{ steps.run.outputs.status }}"
          first_error=""
          if [ "$status" != "0" ]; then
            first_error=$(grep -m1 -iE '^(Error|error in|Fatal error|.*halted)' ../run_all.log || true)
          fi
          git diff -- . ':(exclude)*.pdf' ':(exclude)*.png' ':(exclude)*.rds' > ../changes.diff
          # A CSV whose only differences are floating-point noise is restored and counted, not
          # judged: see compare_csv.py for the tolerance and why.
          noisy_csv=$(git diff --name-only -- '*.csv' | xargs -r python3 ../maintenance/compare_csv.py)
          noise_count=$(echo "$noisy_csv" | grep -c . || true)
          if [ -n "$noisy_csv" ]; then
            echo "$noisy_csv" | xargs git checkout --
          fi
          # With the deposit's slow scripts skipped, every deposited script downstream of them
          # fails for want of their output, so the archive rerun's records cannot match a full
          # run. They are restored and left to the local sweep, which runs the deposit whole;
          # the maintained pipeline and its ground truth are still judged here.
          # run_timings.csv records elapsed seconds, which differ on every run on every machine,
          # so it is restored rather than judged.
          git diff --name-only -- '*run_timings.csv' | xargs -r git checkout --
          # Records of rebuilt-figure-versus-deposit comparisons are pixel and byte comparisons,
          # and Linux rasterizes text with different fonts, so they cannot agree with the Mac
          # that committed them. They are restored and left to the local sweep.
          git diff --name-only -- '*ground_truth/archive_overwrites.csv' '*maintained/output/archive_output_comparison.csv' | xargs -r git checkout --
          skipped_note=""
          if [ "${{ inputs.archive_skip_slow }}" = "true" ]; then
            archive_records=$(git diff --name-only -- ground_truth/archive_run_status.csv ground_truth/archive_overwrites.csv)
            if [ -n "$archive_records" ]; then
              echo "$archive_records" | xargs git checkout --
              skipped_note="The deposit's slow scripts were skipped, as configured, so the archive rerun's records ($(echo $archive_records | tr '\n' ' ')) are not judged here; the local sweep runs the deposit whole."
            fi
          fi
          # Per-repository exemptions, set in make_callers.py. Pathspecs are passed to git
          # unexpanded (set -f), so a glob matches tracked paths, not files in the runner's cwd.
          unjudged_note=""
          if [ -n "$UNJUDGED" ]; then
            set -f
            unjudged_files=$(git diff --name-only -- $UNJUDGED)
            set +f
            if [ -n "$unjudged_files" ]; then
              echo "$unjudged_files" | xargs git checkout --
              unjudged_note="Restored as configured, not judged here: $(echo $unjudged_files | tr '\n' ' ')"
            fi
          fi
          if [ -n "$VERDICTS_ONLY" ]; then
            verdict_ok=$(git diff --name-only -- $VERDICTS_ONLY | xargs -r python3 ../maintenance/compare_csv.py --verdicts)
            if [ -n "$verdict_ok" ]; then
              echo "$verdict_ok" | xargs git checkout --
              unjudged_note="$unjudged_note${unjudged_note:+ }Reproduced values moved but every verdict agrees: $(echo $verdict_ok | tr '\n' ' ')"
            fi
          fi
          if [ -n "$MONTE_CARLO" ]; then
            mc_ok=$(python3 ../maintenance/compare_csv.py --monte-carlo-spec "$MONTE_CARLO" "$MC_RTOL" "$MC_ATOL")
            if [ -n "$mc_ok" ]; then
              echo "$mc_ok" | xargs git checkout --
              unjudged_note="$unjudged_note${unjudged_note:+ }Monte Carlo quantities moved within the configured band (rtol $MC_RTOL, atol $MC_ATOL): $(echo $mc_ok | tr '\n' ' ')"
            fi
          fi
          # Figure files are not judged: PDFs and PNGs drawn on Linux are never byte-identical
          # to the ones drawn on the Mac that committed them. Nor are .rds files, whose bytes
          # differ between two runs on one machine. The numbers behind both are written out
          # as CSVs, and those are judged.
          figures='\.(pdf|png|svg|jpe?g|eps|tiff?|rds)"?$'
          all_changed=$(git status --porcelain)
          changed=$(echo "$all_changed" | grep -viE "$figures" || true)
          figures_changed=$(echo "$all_changed" | grep -iE "$figures" | wc -l | tr -d ' ')
          {
            echo "## ${{ github.repository }}"
            echo
            echo "run_all.R exit status: $status"
            if [ -n "$skipped_note" ]; then
              echo
              echo "$skipped_note"
            fi
            if [ -n "$unjudged_note" ]; then
              echo
              echo "$unjudged_note"
            fi
            if [ -n "$first_error" ]; then
              echo
              echo "First error: \`$first_error\`"
            fi
            if echo "$first_error" | grep -qiE 'md5|checksum|byte size|manifest'; then
              echo
              echo "**The deposit failed verification.** This is the case with a deadline: find out today whether the archive moved, changed, or was withdrawn."
            fi
            if [ "$noise_count" != "0" ]; then
              echo
              echo "CSVs that differ from the committed copies only by floating-point noise (not judged): $noise_count"
            fi
            if [ "$figures_changed" != "0" ]; then
              echo
              echo "Figure and .rds files that differ from the committed copies (not judged): $figures_changed"
            fi
            if [ -n "$changed" ]; then
              echo
              echo "Non-figure files the run changed or created:"
              echo '```'
              echo "$changed"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "0" ] || [ -n "$changed" ]; then
            exit 1
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-check
          path: |
            run_all.log
            packages.csv
            changes.diff
          if-no-files-found: ignore
