# Reruns an active maintenance repository's run_all.R on current R and current CRAN
# packages, and fails if the pipeline breaks or the run changes any committed file.
#
# Each paper repository calls this from a short .github/workflows/maintenance.yml that
# fires once a week in its own slot (see schedule.csv). The gate job runs every week: it
# re-enables the caller's workflow, which stops GitHub from disabling the schedule after
# 60 days without repository activity, and lets the full check through only in the
# repository's own week of the cycle. A manual dispatch always runs the full check.

name: check

on:
  workflow_call:
    inputs:
      phase:
        description: The repository's week in the cycle, from 0 to cycle - 1.
        type: number
        required: true
      cycle:
        description: Weeks between full checks.
        type: number
        default: 8
      archive_skip_slow:
        description: >
          Skip the deposited scripts the deposit documents as slow when the pipeline reruns
          the archive as a program (ARCHIVE_RUN_SKIP_SLOW=1). For a repository whose full run
          exceeds GitHub's six-hour job limit; the maintained pipeline still runs whole, and
          the only change the check accepts is those scripts' rows reading "skipped".
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/maintenance.yml/enable"

      - name: Decide whether this is the repository's week
        id: week
        run: |
          week=$(( $(date -u +%s) / 604800 % ${{ inputs.cycle }} ))
          echo "Cycle week $week; this repository checks in week ${{ inputs.phase }}."
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$week" -eq "${{ inputs.phase }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/checkout@v4
        with:
          repository: active-maintenance-aec/maintenance
          path: maintenance

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Does the pipeline render with Quarto?
        id: quarto
        working-directory: repo
        run: |
          if grep -q quarto run_all.R; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.quarto.outputs.needed == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install the packages the pipeline loads
        working-directory: repo
        run: |
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
          Rscript -e 'pak::pkg_install(c("readr", "stringr", "purrr"), ask = FALSE)'
          Rscript ../maintenance/deps.R

      - name: Record R and package versions
        working-directory: repo
        run: |
          Rscript -e 'print(R.version.string)'
          Rscript -e 'ip <- installed.packages(); readr::write_csv(tibble::as_tibble(ip[, c("Package", "Version")]), "../packages.csv")'

      - name: Run run_all.R
        id: run
        working-directory: repo
        env:
          ARCHIVE_RUN_SKIP_SLOW: ${{ inputs.archive_skip_slow && '1' || '0' }}
        run: |
          set +e
          Rscript run_all.R > ../run_all.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 40 ../run_all.log

      - name: Report
        working-directory: repo
        run: |
          status="${{ steps.run.outputs.status }}"
          first_error=$(grep -m1 -iE '^(Error|error in|Fatal error|.*halted)' ../run_all.log || true)
          skipped_note=""
          status_csv=ground_truth/archive_run_status.csv
          if [ "${{ inputs.archive_skip_slow }}" = "true" ] && [ -f "$status_csv" ]; then
            unexplained=$(git diff -U0 -- "$status_csv" | grep -E '^\+[^+]' | grep -v ',skipped,' || true)
            if [ -z "$unexplained" ] && ! git diff --quiet -- "$status_csv"; then
              git checkout -- "$status_csv"
              skipped_note="The slow deposited scripts were skipped, as configured; their rows in $status_csv were the only change there and were restored."
            fi
          fi
          # Figure files are not judged: PDFs and PNGs drawn on Linux are never byte-identical
          # to the ones drawn on the Mac that committed them. The numbers behind every figure
          # are written out as CSVs, and those are judged.
          figures='\.(pdf|png|svg|jpe?g|eps|tiff?)"?$'
          all_changed=$(git status --porcelain)
          changed=$(echo "$all_changed" | grep -viE "$figures" || true)
          figures_changed=$(echo "$all_changed" | grep -iE "$figures" | wc -l | tr -d ' ')
          git diff -- . ':(exclude)*.pdf' ':(exclude)*.png' > ../changes.diff
          {
            echo "## ${{ github.repository }}"
            echo
            echo "run_all.R exit status: $status"
            if [ -n "$skipped_note" ]; then
              echo
              echo "$skipped_note"
            fi
            if [ -n "$first_error" ]; then
              echo
              echo "First error: \`$first_error\`"
            fi
            if echo "$first_error" | grep -qiE 'md5|checksum|byte size|manifest'; then
              echo
              echo "**The deposit failed verification.** This is the case with a deadline: find out today whether the archive moved, changed, or was withdrawn."
            fi
            if [ "$figures_changed" != "0" ]; then
              echo
              echo "Figure files that differ from the committed copies (not judged): $figures_changed"
            fi
            if [ -n "$changed" ]; then
              echo
              echo "Non-figure files the run changed or created:"
              echo '```'
              echo "$changed"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "0" ] || [ -n "$changed" ]; then
            exit 1
          fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-check
          path: |
            run_all.log
            packages.csv
            changes.diff
          if-no-files-found: ignore
